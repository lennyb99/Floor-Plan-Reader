<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLO Detect</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #1e1e1e;
    --panel:        #2a2a2a;
    --panel-border: #333;
    --text:         #d0d0d0;
    --text-dim:     #666;
    --accent:       #d39e53;
    --accent-dim:   rgba(211,158,83,0.15);
    --font:         'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Nav ── */
  #nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: #252525;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  #nav a {
    color: var(--text-dim); text-decoration: none;
    display: flex; align-items: center; gap: 5px;
    transition: color 0.1s;
  }
  #nav a:hover { color: var(--text); }
  #nav .active { color: var(--accent); font-weight: 600; }
  #nav .sep { color: var(--panel-border); }

  /* ── Layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left panel: controls ── */
  #panel {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
  }
  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  .panel-section {
    padding: 14px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .panel-section h3 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Drop zone */
  #drop-zone {
    border: 1.5px dashed var(--panel-border);
    border-radius: 8px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
    font-size: 12px;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  #drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #drop-zone .dz-icon { font-size: 22px; margin-bottom: 6px; }
  #drop-zone .dz-hint { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  /* Camera button */
  #btn-camera {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: border-color 0.12s, color 0.12s;
  }
  #btn-camera:hover { border-color: var(--accent); color: var(--accent); }

  /* Preview strip */
  #preview-strip {
    display: none;
    align-items: center;
    gap: 10px;
    background: #1e1e1e;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  #preview-strip img {
    width: 40px; height: 40px;
    object-fit: cover; border-radius: 4px;
    border: 1px solid var(--panel-border);
  }
  #preview-strip .meta { flex: 1; min-width: 0; font-size: 11px; }
  #preview-strip .fname {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
  }
  #preview-strip .fsize { color: var(--text-dim); margin-top: 2px; }
  #preview-strip .clear-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 2px 4px;
  }
  #preview-strip .clear-btn:hover { color: #e06c6c; }

  /* Run button */
  #btn-run {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #btn-run:hover:not(:disabled) { opacity: 0.85; }
  #btn-run:disabled { opacity: 0.35; cursor: not-allowed; }

  /* API row */
  .row-label { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .row-input {
    width: 100%;
    background: #1e1e1e;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    padding: 4px 7px;
    outline: none;
    font-family: 'Courier New', monospace;
  }
  .row-input:focus { border-color: var(--accent); color: var(--text); }

  /* Detection list */
  #det-list { display: flex; flex-direction: column; gap: 4px; }
  .det-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 4px;
    background: #1e1e1e;
  }
  .det-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .det-name { flex: 1; }
  .det-conf { color: var(--text-dim); }
  #det-empty { font-size: 11px; color: var(--text-dim); }

  /* ── Viewport ── */
  #viewport {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #1a1a1a;
  }

  #result-img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    display: none;
    border-radius: 4px;
  }

  #viewport-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
  }

  /* Spinner overlay */
  #spinner-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(18,18,18,0.7);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
  }
  #spinner-overlay.active { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--panel-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #spinner-overlay p { font-size: 12px; color: var(--text-dim); }

  /* Error bar */
  #error-bar {
    display: none;
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #3a1a1a; border: 1px solid #7a3030;
    border-radius: 6px; padding: 8px 16px;
    font-size: 12px; color: #e06c6c; white-space: nowrap;
  }

  /* ── Model selector ── */
  .row-select {
    width: 100%;
    background: #1e1e1e;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    padding: 4px 7px;
    outline: none;
    font-family: 'Courier New', monospace;
    cursor: pointer;
  }
  .row-select:focus  { border-color: var(--accent); }
  .row-select:disabled { opacity: 0.4; cursor: not-allowed; }
  #model-status {
    font-size: 10px; color: var(--text-dim);
    min-height: 13px; text-align: right;
  }
  #model-status.ok  { color: #5cb87a; }
  #model-status.err { color: #e06c6c; }

  /* ── Camera modal ── */
  #camera-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 9999;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
  }
  #camera-modal.open { display: flex; }
  #camera-video, #camera-preview {
    width: 100%; max-width: 540px;
    border-radius: 10px; border: 1px solid var(--panel-border);
    aspect-ratio: 4/3; object-fit: cover;
    background: #000;
  }
  #camera-preview { display: none; border-color: var(--accent); }
  #camera-canvas  { display: none; }
  .camera-controls { display: flex; gap: 10px; }
  .cam-btn {
    padding: 9px 20px; border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--text);
    font-family: var(--font); font-size: 13px; cursor: pointer;
    transition: background 0.12s;
  }
  .cam-btn:hover { background: #333; }
  .cam-btn.primary {
    background: var(--accent); border-color: var(--accent);
    color: #1a1a1a; font-weight: 600;
  }
  .cam-btn.primary:hover { opacity: 0.85; }
  #cam-error { font-size: 12px; color: #e06c6c; display: none; }
</style>
</head>
<body>

<!-- Camera modal -->
<div id="camera-modal">
  <video id="camera-video" autoplay playsinline muted></video>
  <img  id="camera-preview" alt="">
  <canvas id="camera-canvas"></canvas>
  <p id="cam-error"></p>
  <div class="camera-controls">
    <button class="cam-btn" id="btn-cam-close">✕ Close</button>
    <button class="cam-btn primary" id="btn-cam-capture">Capture</button>
    <button class="cam-btn" id="btn-cam-retake" style="display:none">↩ Retake</button>
    <button class="cam-btn primary" id="btn-cam-use" style="display:none">Use Photo</button>
  </div>
</div>

<!-- Nav -->
<div id="nav">
  <a href="analyze.html">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6">
      <polyline points="8,2 3,6.5 8,11"/>
    </svg>
    Analyze
  </a>
  <span class="sep">›</span>
  <span class="active">YOLO Detect</span>
</div>

<div id="main">

  <!-- Left panel -->
  <div id="panel">

    <div class="panel-section">
      <h3>Image</h3>
      <div id="drop-zone">
        <input type="file" id="file-input" accept="image/*">
        <div class="dz-icon">🖼️</div>
        <div>Drop image or click to browse</div>
        <div class="dz-hint">PNG · JPG · TIFF</div>
      </div>
      <button id="btn-camera">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1 5.5A1.5 1.5 0 0 1 2.5 4h1.38L5 2h6l1.12 2H13.5A1.5 1.5 0 0 1 15 5.5v7A1.5 1.5 0 0 1 13.5 14h-11A1.5 1.5 0 0 1 1 12.5v-7z"/>
          <circle cx="8" cy="9" r="2.5"/>
        </svg>
        Use Camera
      </button>
      <div id="preview-strip">
        <img id="preview-img" src="" alt="">
        <div class="meta">
          <div class="fname" id="preview-name"></div>
          <div class="fsize" id="preview-size"></div>
        </div>
        <button class="clear-btn" id="btn-clear">✕</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>Settings</h3>
      <div>
        <div class="row-label">YOLO model</div>
        <select class="row-select" id="sel-yolo" disabled><option>Loading…</option></select>
      </div>
      <div id="model-status"></div>
      <div>
        <div class="row-label">API endpoint</div>
        <input class="row-input" type="text" id="api-url" value="http://127.0.0.1:8000/yolo" spellcheck="false">
      </div>
    </div>

    <div class="panel-section">
      <button id="btn-run" disabled>Run Detection</button>
    </div>

    <div class="panel-section" id="section-detections" style="display:none">
      <h3>Detections</h3>
      <div id="det-list"></div>
    </div>

  </div>

  <!-- Viewport -->
  <div id="viewport">
    <div id="viewport-empty">
      <div style="font-size:32px;margin-bottom:10px">🔍</div>
      Upload an image and click Run Detection
    </div>
    <img id="result-img" alt="Detection result">
    <div id="spinner-overlay">
      <div class="spinner"></div>
      <p>Running YOLO…</p>
    </div>
    <div id="error-bar"></div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
//  FILE SELECTION
// ─────────────────────────────────────────────
let selectedFile = null;

const fileInput    = document.getElementById('file-input');
const dropZone     = document.getElementById('drop-zone');
const previewStrip = document.getElementById('preview-strip');
const btnRun       = document.getElementById('btn-run');

function formatBytes(b) {
  return b > 1e6 ? (b/1e6).toFixed(1)+' MB' : (b/1024).toFixed(0)+' KB';
}

function setFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('preview-img').src = url;
  document.getElementById('preview-name').textContent = file.name;
  document.getElementById('preview-size').textContent = formatBytes(file.size);
  previewStrip.style.display = 'flex';
  btnRun.disabled = false;
}

function clearFile() {
  selectedFile = null;
  fileInput.value = '';
  previewStrip.style.display = 'none';
  btnRun.disabled = true;
}

fileInput.addEventListener('change', e => setFile(e.target.files[0]));
document.getElementById('btn-clear').addEventListener('click', clearFile);

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  setFile(e.dataTransfer.files[0]);
});

// ─────────────────────────────────────────────
//  CAMERA  (same pattern as analyze.html)
// ─────────────────────────────────────────────
const modal      = document.getElementById('camera-modal');
const video      = document.getElementById('camera-video');
const canvas     = document.getElementById('camera-canvas');
const preview    = document.getElementById('camera-preview');
const camError   = document.getElementById('cam-error');
let cameraStream = null;

async function openCamera() {
  camError.style.display = 'none';
  preview.style.display  = 'none';
  video.style.display    = 'block';
  document.getElementById('btn-cam-capture').style.display = '';
  document.getElementById('btn-cam-retake').style.display  = 'none';
  document.getElementById('btn-cam-use').style.display     = 'none';
  modal.classList.add('open');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false,
    });
    video.srcObject = cameraStream;
  } catch (err) {
    camError.textContent   = `Camera unavailable: ${err.message}`;
    camError.style.display = 'block';
    document.getElementById('btn-cam-capture').style.display = 'none';
  }
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  video.srcObject = null;
  modal.classList.remove('open');
}

function captureFrame() {
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  preview.src = canvas.toDataURL('image/jpeg', 0.92);
  preview.style.display = 'block';
  video.style.display   = 'none';
  document.getElementById('btn-cam-capture').style.display = 'none';
  document.getElementById('btn-cam-retake').style.display  = '';
  document.getElementById('btn-cam-use').style.display     = '';
}

function retake() {
  preview.style.display   = 'none';
  video.style.display     = 'block';
  document.getElementById('btn-cam-capture').style.display = '';
  document.getElementById('btn-cam-retake').style.display  = 'none';
  document.getElementById('btn-cam-use').style.display     = 'none';
}

function usePhoto() {
  canvas.toBlob(blob => {
    setFile(new File([blob], 'camera-capture.jpg', { type: 'image/jpeg' }));
    closeCamera();
  }, 'image/jpeg', 0.92);
}

document.getElementById('btn-camera').addEventListener('click',      openCamera);
document.getElementById('btn-cam-close').addEventListener('click',   closeCamera);
document.getElementById('btn-cam-capture').addEventListener('click', captureFrame);
document.getElementById('btn-cam-retake').addEventListener('click',  retake);
document.getElementById('btn-cam-use').addEventListener('click',     usePhoto);

// ─────────────────────────────────────────────
//  DETECTION
// ─────────────────────────────────────────────
const resultImg      = document.getElementById('result-img');
const spinnerOverlay = document.getElementById('spinner-overlay');
const viewportEmpty  = document.getElementById('viewport-empty');
const errorBar       = document.getElementById('error-bar');
const detList        = document.getElementById('det-list');
const sectionDets    = document.getElementById('section-detections');

// Deterministic colour per class name (matches server-side palette logic)
function classColor(name) {
  let hash = 0;
  for (const c of name) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
  const r = Math.max(((hash >> 16) & 0xff), 120);
  const g = Math.max(((hash >> 8)  & 0xff), 120);
  const b = Math.max(( hash        & 0xff), 120);
  return `rgb(${r},${g},${b})`;
}

function showError(msg) {
  errorBar.textContent   = msg;
  errorBar.style.display = 'block';
  setTimeout(() => { errorBar.style.display = 'none'; }, 5000);
}

document.getElementById('btn-run').addEventListener('click', async () => {
  if (!selectedFile) return;

  const apiUrl = document.getElementById('api-url').value.trim();

  // Show spinner
  spinnerOverlay.classList.add('active');
  viewportEmpty.style.display = 'none';
  resultImg.style.display     = 'none';
  errorBar.style.display      = 'none';
  sectionDets.style.display   = 'none';

  try {
    const form = new FormData();
    form.append('file', selectedFile);

    const res  = await fetch(apiUrl, { method: 'POST', body: form });
    if (!res.ok) throw new Error(`Server responded ${res.status}`);

    const data = await res.json();

    // Show annotated image
    resultImg.src           = `data:image/png;base64,${data.image_b64}`;
    resultImg.style.display = 'block';

    // Populate detection list
    detList.innerHTML = '';
    if (data.detections.length === 0) {
      detList.innerHTML = '<span id="det-empty">No detections.</span>';
    } else {
      // Group by class for a cleaner summary
      const groups = {};
      data.detections.forEach(d => {
        if (!groups[d.name]) groups[d.name] = [];
        groups[d.name].push(d.confidence);
      });

      Object.entries(groups)
        .sort((a, b) => b[1].length - a[1].length)
        .forEach(([name, confs]) => {
          const avg  = (confs.reduce((s, c) => s + c, 0) / confs.length * 100).toFixed(0);
          const item = document.createElement('div');
          item.className = 'det-item';
          item.innerHTML = `
            <span class="det-dot" style="background:${classColor(name)}"></span>
            <span class="det-name">${name}</span>
            <span class="det-conf">${confs.length}× · ${avg}% avg</span>`;
          detList.appendChild(item);
        });
    }

    sectionDets.style.display = 'flex';

  } catch (err) {
    showError(err.message);
    viewportEmpty.style.display = 'block';
  } finally {
    spinnerOverlay.classList.remove('active');
  }
});
// ─────────────────────────────────────────────
//  YOLO MODEL SELECTOR
// ─────────────────────────────────────────────
const selYolo     = document.getElementById('sel-yolo');
const modelStatus = document.getElementById('model-status');

function setModelStatus(msg, type = '') {
  modelStatus.textContent = msg;
  modelStatus.className   = type;
}

async function loadModelList() {
  const base = new URL(document.getElementById('api-url').value).origin;
  try {
    const res  = await fetch(`${base}/models`);
    const data = await res.json();

    selYolo.innerHTML = '';
    data.yolo_models.forEach(f => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = f;
      selYolo.appendChild(opt);
    });
    selYolo.disabled = data.yolo_models.length === 0;
    if (data.active_yolo) selYolo.value = data.active_yolo;

    setModelStatus(`Active: ${data.active_yolo ?? '—'}`, 'ok');
  } catch {
    setModelStatus('Could not load model list.', 'err');
  }
}

selYolo.addEventListener('change', async () => {
  const base = new URL(document.getElementById('api-url').value).origin;
  setModelStatus('Loading model…');
  try {
    const res  = await fetch(`${base}/active-models`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ yolo: selYolo.value }),
    });
    if (!res.ok) { const e = await res.json(); setModelStatus(e.detail || 'Swap failed.', 'err'); return; }
    const data = await res.json();
    setModelStatus(`Active: ${data.active_yolo ?? '—'}`, 'ok');
  } catch {
    setModelStatus('Server unreachable.', 'err');
  }
});

loadModelList();
</script>
</body>
</html>
