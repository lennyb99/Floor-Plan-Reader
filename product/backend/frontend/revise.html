<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floorplan Revise</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #1e1e1e;
    --panel:      #2a2a2a;
    --panel-border:#333;
    --toolbar:    #252525;
    --text:       #d0d0d0;
    --text-dim:   #777;
    --accent:     #d39e53;
    --accent-dim: rgba(211,158,83,0.18);
    --select-line:#4a7bd5;
    --wall:       #b0b0b0;
    --wall-stroke:#888;
    --window-bg:  #6fa3c8;
    --door-bg:    #8b7ec8;
    --hover:      rgba(255,255,255,0.05);
    --row-active: rgba(211,158,83,0.22);
    --font:       'Segoe UI', system-ui, sans-serif;
    --icon-size:  18px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

    /* ── Nav ── */
  #nav {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #252525;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  #nav a {
    color: var(--text-dim); text-decoration: none;
    display: flex; align-items: center; gap: 4px;
    padding: 2px 0;
    transition: color 0.1s;
  }
  #nav a:hover { color: var(--text); }
  #nav .sep { color: var(--panel-border); padding: 0 2px; }
  #nav .active { color: var(--accent); font-weight: 600; }
  #nav .source-name {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-family: "Courier New", monospace; color: var(--text-dim);
    pointer-events: none;
  }
  #nav .util-links { margin-left: auto; display: flex; gap: 6px; }
  #nav .util-links a {
    font-size: 11px; padding: 3px 9px;
    border: 1px solid var(--panel-border); border-radius: 4px;
  }
  #nav .util-links a:hover { color: var(--text); border-color: #555; }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--toolbar);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }

  .tool-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    font-size: var(--icon-size);
  }
  .tool-btn:hover { background: var(--hover); color: var(--text); }
  .tool-btn:disabled { opacity: 0.28; cursor: not-allowed; }
  .tool-btn:disabled:hover { background: transparent; color: var(--text-dim); }
  .tool-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Viewport ── */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1a1a1a;
    cursor: default;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
  }

  /* Upload button */
  #btn-upload {
    position: absolute;
    bottom: 14px; left: 14px;
    width: 36px; height: 36px;
    border-radius: 8px;
    background: #333;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: background 0.15s, color 0.15s;
  }
  #btn-upload:hover { background: #3a3a3a; color: var(--text); }

  /* Trash icon on hierarchy rows */
  .hier-row .trash {
    margin-left: auto;
    width: 16px; height: 16px;
    display: none;
    align-items: center; justify-content: center;
    color: var(--text-dim);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .hier-row:hover .trash { display: flex; }
  .hier-row .trash:hover { color: #e06c6c; }

  /* Download button */
  #btn-download {
    position: absolute;
    bottom: 14px; right: 14px;
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--accent);
    border: none;
    color: #1a1a1a;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: opacity 0.15s;
  }
  #btn-download:hover { opacity: 0.85; }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  /* Coords strip */
  #coords-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--text-dim);
    min-height: 38px;
  }
  #coords-strip label { color: var(--text-dim); width: 10px; }
  #coords-strip input {
    width: 52px;
    background: #1e1e1e;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    padding: 2px 5px;
    outline: none;
  }
  #coords-strip input:focus { border-color: var(--accent); }
  #coords-strip input:disabled { opacity: 0.35; cursor: not-allowed; }


  /* Hierarchy */
  #hierarchy {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 0;
  }
  #hierarchy::-webkit-scrollbar { width: 5px; }
  #hierarchy::-webkit-scrollbar-track { background: transparent; }
  #hierarchy::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .hier-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 4px;
    margin: 0 4px;
    transition: background 0.1s;
    white-space: nowrap;
  }
  .hier-row:hover { background: var(--hover); }
  .hier-row.selected { background: var(--row-active); color: var(--accent); }

  .hier-row .toggle {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .hier-row .toggle.spacer { visibility: hidden; }

  .hier-row .icon {
    width: 14px; height: 14px;
    border-radius: 2px;
    border: 1.5px solid;
    flex-shrink: 0;
  }
  .icon-wall   { border-color: var(--wall-stroke); background: transparent; }
  .icon-window { border-color: var(--window-bg);  background: rgba(111,163,200,0.25); }
  .icon-door   { border-color: var(--door-bg);    background: rgba(139,126,200,0.25); }

  .hier-row .label {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .child-row { padding-left: 28px; }

  /* ── Page transition overlay ── */
  #page-transition {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    z-index: 9999;
    pointer-events: none;
    opacity: 1;                          /* starts visible, fades out on load */
    transition: opacity 0.45s ease;
  }
  #page-transition.hidden { opacity: 0; pointer-events: none; }
  .pt-bar {
    width: 160px; height: 2px;
    background: var(--panel-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .pt-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    animation: ptSlide 1.1s ease-in-out infinite alternate;
  }
  @keyframes ptSlide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(200%); }
  }
  .pt-label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }

  /* ── Debug panel ── */
  #debug-panel {
    display: none;
    position: fixed;
    bottom: 60px; left: 14px;
    width: 380px; max-height: 320px;
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #7ec699;
    z-index: 999;
    flex-direction: column;
    overflow: hidden;
  }
  #debug-panel.visible { display: flex; }
  #debug-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    color: #aaa; font-size: 11px;
  }
  #debug-header button {
    background: none; border: none; color: #666;
    cursor: pointer; font-size: 13px; padding: 0 4px;
  }
  #debug-header button:hover { color: #aaa; }
  #debug-body { overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
  #btn-debug {
    position: absolute;
    bottom: 58px; left: 14px;
    width: 36px; height: 36px;
    border-radius: 8px;
    background: #222;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: background 0.15s;
    z-index: 10;
  }
  #btn-debug:hover { background: #2a2a2a; color: var(--text); }
</style>
</head>
<body>

<div id="page-transition">
  <div class="pt-bar"><div class="pt-bar-fill"></div></div>
  <span class="pt-label" id="pt-label">Loading editor…</span>
</div>

<div id="nav">
  <a href="analyze.html">Analyze</a>
  <span class="sep">›</span>
  <span class="active">Revise</span>
  <span class="sep">›</span>
  <a href="view3d.html">3D View</a>
  <span class="source-name" id="nav-source"></span>
  <div class="util-links">
    <a href="detect.html">YOLO Debug ↗</a>

  </div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tool-btn" id="tb-grid"    title="Grid ein/aus">
    <!-- grid icon -->
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="1" y="1" width="6" height="6"/><rect x="11" y="1" width="6" height="6"/>

  </button>
  <button class="tool-btn" id="tb-refimg"  title="Referenzbild ein/aus">
    <!-- image icon -->
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">

      <circle cx="6" cy="7" r="1.5"/>

  <button class="tool-btn" id="tb-labels"  title="Objektnamen ein/aus">

    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">

    </svg>
  </button>

    <!-- ruler icon -->

      <line x1="4"  y1="6" x2="4"  y2="8.5"/>
      <line x1="7"  y1="6" x2="7"  y2="8.5"/>

  <div style="width:1px;height:20px;background:var(--panel-border);margin:0 4px"></div>

  <button class="tool-btn" id="tb-undo" title="Rückgängig (Ctrl+Z)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">

<!-- Main area -->
<div id="main">
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <input type="file" id="refimg-input" accept="image/*" style="display:none">
    <input type="file" id="file-input" accept=".json" style="display:none">
    <button id="btn-debug" title="Debug: show localStorage data">{ }</button>
    <div id="debug-panel">
      <div id="debug-header">

          <button id="btn-debug-copy" title="Copy">⎘</button>

        </span>

  <div id="sidebar">

      <label>X</label>
      <input type="number" id="inp-x" disabled>

    </div>
    <div id="hierarchy"></div>

</div>

<script>

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const state = {
  data:        null,   // populated after JSON upload
  showGrid:    false,
  showRefImg:  false,
  refImg:       null,   // HTMLImageElement loaded by user
  showLabels:  false,
  showMeasure: true,
  selected:    null,
  collapsed:   {},
  drag:        null,
  panDrag:        null,   // middle-mouse pan
  detectionsOnly:  false,  // true when server returned detections but no walls
  pan:         { x: 0, y: 0 },
  scale:       1,
};

// ─────────────────────────────────────────────
//  HISTORY  (undo / redo, max 10 steps)
// ─────────────────────────────────────────────
const HISTORY_MAX = 10;
const history = { stack: [], cursor: -1 };

function pushHistory() {
  // Discard any redo states ahead of cursor
  history.stack = history.stack.slice(0, history.cursor + 1);
  history.stack.push(JSON.stringify(state.data));
  if (history.stack.length > HISTORY_MAX) history.stack.shift();
  history.cursor = history.stack.length - 1;
  updateHistoryButtons();
}

function undo() {
  if (history.cursor <= 0) return;
  history.cursor--;
  state.data     = JSON.parse(history.stack[history.cursor]);
  state.selected = null;
  updateHistoryButtons();
  updateSidebar();
  render();
}

function redo() {
  if (history.cursor >= history.stack.length - 1) return;
  history.cursor++;
  state.data     = JSON.parse(history.stack[history.cursor]);
  state.selected = null;
  updateHistoryButtons();
  updateSidebar();
  render();
}

function updateHistoryButtons() {
  document.getElementById('tb-undo').disabled = history.cursor <= 0;
  document.getElementById('tb-redo').disabled = history.cursor >= history.stack.length - 1;
}

document.getElementById('tb-undo').addEventListener('click', undo);
document.getElementById('tb-redo').addEventListener('click', redo);

// Build flat object lookup: id → wall / child
function buildIndex() {
  const idx = {};
  state.data.walls.forEach(w => {
    idx[w.id] = { kind:'wall', wall: w };
    w.windows.forEach((win, i) => idx[`${w.id}_win_${i}`] = { kind:'window', wall: w, idx: i, obj: win });
    w.doors.forEach((d, i)     => idx[`${w.id}_door_${i}`] = { kind:'door',   wall: w, idx: i, obj: d });
  });
  return idx;
}

// ─────────────────────────────────────────────
//  CANVAS / RENDERING
// ─────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const viewport = document.getElementById('viewport');

const COLORS = {
  wall:         '#c0c0c0',
  wallStroke:   '#888',
  window:       '#6fa3c8',
  windowFill:   'rgba(111,163,200,0.35)',
  door:         '#8b7ec8',
  doorFill:     'rgba(139,126,200,0.35)',
  selected:     '#d39e53',
  measure:      '#4a7bd5',
  label:        '#d0d0d0',
  grid:         'rgba(255,255,255,0.05)',
};

function resize() {
  const r = viewport.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
  autoFit();
}

function autoFit() {
  if (!state.data) return;
  const walls = state.data.walls;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  walls.forEach(w => {
    minX = Math.min(minX, w.start.x, w.end.x);
    minY = Math.min(minY, w.start.y, w.end.y);
    maxX = Math.max(maxX, w.start.x, w.end.x);
    maxY = Math.max(maxY, w.start.y, w.end.y);
  });
  const pw = canvas.width - 80, ph = canvas.height - 80;
  const fw = maxX - minX, fh = maxY - minY;
  state.scale = Math.min(pw / fw, ph / fh);
  state.pan.x = (canvas.width  - fw * state.scale) / 2 - minX * state.scale;
  state.pan.y = (canvas.height - fh * state.scale) / 2 - minY * state.scale;
  render();
}

// world → screen
function ws(x, y) {
  return { x: x * state.scale + state.pan.x, y: y * state.scale + state.pan.y };
}
// screen → world
function sw(x, y) {
  return { x: (x - state.pan.x) / state.scale, y: (y - state.pan.y) / state.scale };
}

function wallIsHorizontal(w) {
  return Math.abs(w.end.y - w.start.y) < Math.abs(w.end.x - w.start.x);
}

// Returns canvas-space rect {x,y,w,h} for a wall segment
function wallRect(wall) {
  const t  = Math.max(wall.thickness, 2);
  const s  = ws(wall.start.x, wall.start.y);
  const e  = ws(wall.end.x, wall.end.y);
  const ts = t * state.scale;
  if (wallIsHorizontal(wall)) {
    const x = Math.min(s.x, e.x);
    const y = s.y - ts / 2;
    return { x, y, w: Math.abs(e.x - s.x), h: ts };
  } else {
    const x = s.x - ts / 2;
    const y = Math.min(s.y, e.y);
    return { x, y, w: ts, h: Math.abs(e.y - s.y) };
  }
}

// Returns canvas-space rect for a child (window/door) on its parent wall
function childRect(wall, child) {
  const isH = wallIsHorizontal(wall);
  const t   = Math.max(wall.thickness, 2);
  const ts  = t * state.scale;
  const cen = ws(child.center.x, child.center.y);
  const hw  = (child.width  * state.scale) / 2;
  const hh  = (child.height * state.scale) / 2;
  if (isH) return { x: cen.x - hw, y: cen.y - ts / 2, w: hw * 2, h: ts };
  else     return { x: cen.x - ts / 2, y: cen.y - hh,  w: ts,     h: hh * 2 };
}

function isSelected(kind, wall, idx) {
  const s = state.selected;
  if (!s) return false;
  if (s.kind === 'wall' && kind === 'wall' && s.wallId === wall.id) return true;
  if (s.kind === kind && s.wallId === wall.id && s.idx === idx) return true;
  return false;
}

function render() {
  const { width: W, height: H } = canvas;
  ctx.clearRect(0, 0, W, H);

  // Reference image underlay
  if (state.showRefImg && state.refImg) {
    ctx.save();
    ctx.globalAlpha = 0.45;
    // Draw scaled + panned to match the viewport transform
    const iw = state.refImg.naturalWidth;
    const ih = state.refImg.naturalHeight;
    ctx.drawImage(state.refImg,
      state.pan.x, state.pan.y,
      iw * state.scale, ih * state.scale);
    ctx.restore();
  }

  // Empty state — no file loaded yet
  if (!state.data) {
    ctx.textAlign = 'center';
    ctx.font = '14px ' + getComputedStyle(document.body).fontFamily;
    if (state.detectionsOnly) {
      ctx.fillStyle = '#c8a04a';
      ctx.fillText('YOLO detections received — wall segmentation not yet run.', W / 2, H / 2 - 12);
      ctx.fillStyle = '#555';
      ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('Run the full pipeline (YOLO + UNet) to enable the editor.', W / 2, H / 2 + 12);
    } else {
      ctx.fillStyle = '#444';
      ctx.fillText('Load a JSON file  ↙', W / 2, H / 2);
    }
    return;
  }

  // Grid
  if (state.showGrid) {
    const gridStep = 20 * state.scale;
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    const ox = state.pan.x % gridStep;
    const oy = state.pan.y % gridStep;
    for (let x = ox; x < W; x += gridStep) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = oy; y < H; y += gridStep) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }

  // Measure lines (blue dashed border around whole floorplan)
  if (state.showMeasure) {
    const walls = state.data.walls;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    walls.forEach(w => {
      minX = Math.min(minX, w.start.x, w.end.x);
      minY = Math.min(minY, w.start.y, w.end.y);
      maxX = Math.max(maxX, w.start.x, w.end.x);
      maxY = Math.max(maxY, w.start.y, w.end.y);
    });
    const pad = 18;
    const tl = ws(minX, minY);
    const br = ws(maxX, maxY);
    ctx.strokeStyle = COLORS.measure;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(tl.x - pad, tl.y - pad, br.x - tl.x + pad * 2, br.y - tl.y + pad * 2);
    ctx.setLineDash([]);
    // tick marks
    const tickLen = 6;
    ctx.strokeStyle = COLORS.measure;
    ctx.lineWidth = 1;
    [[tl.x - pad, tl.y - pad],[br.x + pad, tl.y - pad],[tl.x - pad, br.y + pad],[br.x + pad, br.y + pad]].forEach(([cx,cy]) => {
      ctx.beginPath(); ctx.moveTo(cx - tickLen, cy); ctx.lineTo(cx + tickLen, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - tickLen); ctx.lineTo(cx, cy + tickLen); ctx.stroke();
    });
  }

  // Walls
  state.data.walls.forEach(wall => {
    const r   = wallRect(wall);
    const sel = isSelected('wall', wall, null);

    ctx.fillStyle = COLORS.wall;
    ctx.strokeStyle = COLORS.wallStroke;
    ctx.lineWidth = 0.5;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    if (sel) {
      ctx.strokeStyle = COLORS.selected;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    }

    // Windows
    wall.windows.forEach((win, i) => {
      const cr   = childRect(wall, win);
      const csel = isSelected('window', wall, i);
      drawWindow(cr, wallIsHorizontal(wall));
      if (csel) drawSelectionOutline(cr);
      if (state.showLabels) drawLabel(`win_${win.detection_id}`, cr.x + cr.w / 2, cr.y - 6);
    });

    // Doors
    wall.doors.forEach((door, i) => {
      const cr   = childRect(wall, door);
      const csel = isSelected('door', wall, i);
      ctx.fillStyle   = COLORS.doorFill;
      ctx.strokeStyle = COLORS.door;
      ctx.lineWidth   = 1.5;
      ctx.fillRect(cr.x, cr.y, cr.w, cr.h);
      ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
      if (csel) drawSelectionOutline(cr);
      if (state.showLabels) drawLabel(`door_${door.detection_id}`, cr.x + cr.w / 2, cr.y - 6);
    });

    if (state.showLabels) {
      const r2 = wallRect(wall);
      drawLabel(wall.id, r2.x + r2.w / 2, r2.y - 4);
    }
  });
}

function drawLabel(text, cx, cy) {
  ctx.font = `10px ${getComputedStyle(document.body).fontFamily}`;
  ctx.fillStyle = COLORS.label;
  ctx.textAlign = 'center';
  ctx.fillText(text, cx, cy);
}

// Window: grey fill + dark border + center line parallel to wall
function drawWindow(cr, isHorizontal) {
  const lw = 1.5 * Math.min(state.scale, 1.5);
  ctx.fillStyle   = '#4d4d4d';
  ctx.strokeStyle = '#1c2652';
  ctx.lineWidth   = lw * 2;
  ctx.fillRect(cr.x, cr.y, cr.w, cr.h);
  ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
  // center line runs along the wall (parallel to wall direction)
  ctx.beginPath();
  if (isHorizontal) {
    const my = cr.y + cr.h / 2;
    ctx.moveTo(cr.x, my); ctx.lineTo(cr.x + cr.w, my);
  } else {
    const mx = cr.x + cr.w / 2;
    ctx.moveTo(mx, cr.y); ctx.lineTo(mx, cr.y + cr.h);
  }
  ctx.stroke();
}

function drawSelectionOutline(cr) {
  ctx.strokeStyle = COLORS.selected;
  ctx.lineWidth   = 2;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(cr.x - 3, cr.y - 3, cr.w + 6, cr.h + 6);
  ctx.setLineDash([]);
}

// ─────────────────────────────────────────────
//  HIT TESTING
// ─────────────────────────────────────────────
function hitTest(sx, sy) {
  // Test children first (smaller targets)
  for (const wall of state.data.walls) {
    for (let i = wall.windows.length - 1; i >= 0; i--) {
      const r = childRect(wall, wall.windows[i]);
      if (inRect(sx, sy, r)) return { kind:'window', wall, idx: i, obj: wall.windows[i] };
    }
    for (let i = wall.doors.length - 1; i >= 0; i--) {
      const r = childRect(wall, wall.doors[i]);
      if (inRect(sx, sy, r)) return { kind:'door', wall, idx: i, obj: wall.doors[i] };
    }
  }
  for (const wall of state.data.walls) {
    const r = wallRect(wall);
    if (inRect(sx, sy, r)) return { kind:'wall', wall };
  }
  return null;
}

function inRect(sx, sy, r) {
  return sx >= r.x - 3 && sx <= r.x + r.w + 3 && sy >= r.y - 3 && sy <= r.y + r.h + 3;
}

// ─────────────────────────────────────────────
//  SELECTION
// ─────────────────────────────────────────────
function select(hit) {
  if (!hit) {
    state.selected = null;
  } else if (hit.kind === 'wall') {
    state.selected = { kind:'wall', wallId: hit.wall.id };
  } else {
    state.selected = { kind: hit.kind, wallId: hit.wall.id, idx: hit.idx };
  }
  updateSidebar();
  render();
}

function getSelectedObject() {
  const s = state.selected;
  if (!s) return null;
  const wall = state.data.walls.find(w => w.id === s.wallId);
  if (!wall) return null;
  if (s.kind === 'wall') return { obj: wall, kind: 'wall', wall };
  if (s.kind === 'window') return { obj: wall.windows[s.idx], kind: 'window', wall };
  if (s.kind === 'door')   return { obj: wall.doors[s.idx],   kind: 'door',   wall };
  return null;
}

function getCenter(sel) {
  const r = getSelectedObject();
  if (!r) return null;
  if (r.kind === 'wall') {
    return {
      x: Math.round((r.obj.start.x + r.obj.end.x) / 2),
      y: Math.round((r.obj.start.y + r.obj.end.y) / 2)
    };
  }
  return { x: Math.round(r.obj.center.x), y: Math.round(r.obj.center.y) };
}

// ─────────────────────────────────────────────
//  DRAG (move children along wall)
// ─────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  if (e.button === 1) {                         // middle mouse → pan
    e.preventDefault();
    state.panDrag = { startSX: sx, startSY: sy, origPan: { ...state.pan } };
    canvas.style.cursor = 'grabbing';
    return;
  }

  const hit = hitTest(sx, sy);
  select(hit);

  if (hit && (hit.kind === 'window' || hit.kind === 'door')) {
    state.drag = {
      kind:  hit.kind,
      wall:  hit.wall,
      idx:   hit.idx,
      obj:   hit.obj,
      startSX: sx, startSY: sy,
      origCenter: { ...hit.obj.center },
    };
  }
});

canvas.addEventListener('mousemove', e => {
  if (state.panDrag) {
    const rect = canvas.getBoundingClientRect();
    state.pan.x = state.panDrag.origPan.x + (e.clientX - rect.left - state.panDrag.startSX);
    state.pan.y = state.panDrag.origPan.y + (e.clientY - rect.top  - state.panDrag.startSY);
    render();
    return;
  }
  if (!state.drag) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const dx = (sx - state.drag.startSX) / state.scale;
  const dy = (sy - state.drag.startSY) / state.scale;
  const wall = state.drag.wall;
  const obj  = state.drag.obj;
  const isH  = wallIsHorizontal(wall);

  if (isH) {
    // Clamp to wall bounds
    const minX = Math.min(wall.start.x, wall.end.x) + obj.width / 2;
    const maxX = Math.max(wall.start.x, wall.end.x) - obj.width / 2;
    obj.center.x = Math.max(minX, Math.min(maxX, state.drag.origCenter.x + dx));
  } else {
    const minY = Math.min(wall.start.y, wall.end.y) + obj.height / 2;
    const maxY = Math.max(wall.start.y, wall.end.y) - obj.height / 2;
    obj.center.y = Math.max(minY, Math.min(maxY, state.drag.origCenter.y + dy));
  }

  updateCoordsStrip();
  render();
});

canvas.addEventListener('mouseup', e => {
  if (state.panDrag) {
    state.panDrag = null;
    canvas.style.cursor = '';
    return;
  }
  if (state.drag) { pushHistory(); state.drag = null; }
});
canvas.addEventListener('mouseleave', () => {
  state.drag = null;
  if (state.panDrag) { state.panDrag = null; canvas.style.cursor = ''; }
});

// ─────────────────────────────────────────────
//  SIDEBAR: HIERARCHY + COORDS
// ─────────────────────────────────────────────
function updateSidebar() {
  updateCoordsStrip();
  buildHierarchy();
}

function updateCoordsStrip() {
  const c    = getCenter();
  const inpX = document.getElementById('inp-x');
  const inpY = document.getElementById('inp-y');
  if (c) {
    inpX.disabled = false; inpX.value = c.x;
    inpY.disabled = false; inpY.value = c.y;
  } else {
    inpX.disabled = true; inpX.value = '';
    inpY.disabled = true; inpY.value = '';
  }
}

document.getElementById('inp-x').addEventListener('change', e => {
  const r = getSelectedObject();
  if (!r) return;
  const val = parseInt(e.target.value, 10);
  if (isNaN(val)) return;
  pushHistory();
  if (r.kind === 'wall') {
    const d = val - Math.round((r.obj.start.x + r.obj.end.x) / 2);
    r.obj.start.x += d; r.obj.end.x += d;
  } else { r.obj.center.x = val; }
  render();
});

document.getElementById('inp-y').addEventListener('change', e => {
  const r = getSelectedObject();
  if (!r) return;
  const val = parseInt(e.target.value, 10);
  if (isNaN(val)) return;
  pushHistory();
  if (r.kind === 'wall') {
    const d = val - Math.round((r.obj.start.y + r.obj.end.y) / 2);
    r.obj.start.y += d; r.obj.end.y += d;
  } else { r.obj.center.y = val; }
  render();
});

function makeTrashBtn(onDelete) {
  const btn = document.createElement('span');
  btn.className = 'trash';
  btn.title = 'Löschen (Entf)';
  btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
    <polyline points="1,3 11,3"/><path d="M4,3V2h4v1"/><path d="M2,3l.8,7.5h6.4L10,3"/>
    <line x1="4.5" y1="5.5" x2="4.5" y2="8.5"/><line x1="7.5" y1="5.5" x2="7.5" y2="8.5"/>
  </svg>`;
  btn.addEventListener('click', e => { e.stopPropagation(); onDelete(); });
  return btn;
}

function buildHierarchy() {
  const container = document.getElementById('hierarchy');
  container.innerHTML = '';
  if (!state.data) return;

  // Group walls as parent rows
  state.data.walls.forEach(wall => {
    const hasChildren = wall.windows.length + wall.doors.length > 0;
    const collapsed   = !!state.collapsed[wall.id];
    const selWall     = state.selected && state.selected.kind === 'wall' && state.selected.wallId === wall.id;

    // Wall row
    const row = document.createElement('div');
    row.className = 'hier-row' + (selWall ? ' selected' : '');

    // Toggle arrow
    const toggle = document.createElement('span');
    toggle.className = 'toggle' + (hasChildren ? '' : ' spacer');
    toggle.textContent = hasChildren ? (collapsed ? '▶' : '▼') : '▶';
    if (hasChildren) {
      toggle.addEventListener('click', ev => {
        ev.stopPropagation();
        state.collapsed[wall.id] = !state.collapsed[wall.id];
        buildHierarchy();
      });
    }

    const icon  = document.createElement('span');
    icon.className = 'icon icon-wall';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = wall.id;

    row.append(toggle, icon, label);

    const trash = makeTrashBtn(() => {
      state.selected = { kind:'wall', wallId: wall.id };
      deleteSelected();
    });
    row.append(trash);

    row.addEventListener('click', () => {
      state.selected = { kind:'wall', wallId: wall.id };
      updateSidebar();
      render();
    });
    container.appendChild(row);

    // Children
    if (!collapsed) {
      wall.windows.forEach((win, i) => {
        const cs = state.selected && state.selected.kind === 'window' && state.selected.wallId === wall.id && state.selected.idx === i;
        addChildRow(container, wall, 'window', `win_${win.detection_id}`, i, cs);
      });
      wall.doors.forEach((door, i) => {
        const cs = state.selected && state.selected.kind === 'door' && state.selected.wallId === wall.id && state.selected.idx === i;
        addChildRow(container, wall, 'door', `door_${door.detection_id}`, i, cs);
      });
    }
  });
}

function addChildRow(container, wall, kind, name, idx, selected) {
  const row = document.createElement('div');
  row.className = 'hier-row child-row' + (selected ? ' selected' : '');

  const toggle = document.createElement('span');
  toggle.className = 'toggle spacer';
  toggle.textContent = '▶';

  const icon = document.createElement('span');
  icon.className = `icon icon-${kind}`;

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = name;

  row.append(toggle, icon, label);

  const trash = makeTrashBtn(() => {
    state.selected = { kind, wallId: wall.id, idx };
    deleteSelected();
  });
  row.append(trash);

  row.addEventListener('click', () => {
    state.selected = { kind, wallId: wall.id, idx };
    updateSidebar();
    render();
  });
  container.appendChild(row);
}

// ─────────────────────────────────────────────
//  TOOLBAR TOGGLES
// ─────────────────────────────────────────────
function bindToggle(id, key, cb) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => {
    state[key] = !state[key];
    btn.classList.toggle('active', state[key]);
    if (cb) cb();
    render();
  });
}

bindToggle('tb-grid',    'showGrid');

// Reference image toggle: first click opens file picker (if no image loaded yet),
// subsequent clicks just show/hide the loaded image
document.getElementById('tb-refimg').addEventListener('click', () => {
  if (!state.refImg) {
    // No image from analyze yet — let user pick one manually
    document.getElementById('refimg-input').click();
  } else {
    state.showRefImg = !state.showRefImg;
    document.getElementById('tb-refimg').classList.toggle('active', state.showRefImg);
    render();
  }
});

document.getElementById('refimg-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    state.refImg      = img;
    state.showRefImg  = true;
    document.getElementById('tb-refimg').classList.add('active');
    render();
  };
  img.src = url;
  e.target.value = '';
});
bindToggle('tb-labels',  'showLabels');
bindToggle('tb-measure', 'showMeasure');

// ─────────────────────────────────────────────
//  DOWNLOAD
// ─────────────────────────────────────────────
document.getElementById('btn-download').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state.data, null, 4)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'floorplan_edited.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ─────────────────────────────────────────────
//  LOAD JSON
// ─────────────────────────────────────────────
function loadJSON(json) {
  // Detections-only format (YOLO without wall segmentation): { detections: [...] }
  // Full format: { walls: [...] }
  if (!json.walls && json.detections) {
    state.data          = null;
    state.detectionsOnly = true;
    render();
    buildHierarchy();
    return;
  }
  state.detectionsOnly = false;
  state.data      = json;
  state.selected  = null;
  state.collapsed = {};
  history.stack   = [];
  history.cursor  = -1;
  pushHistory();
  autoFit();
  updateSidebar();
}

document.getElementById('btn-upload').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadJSON(JSON.parse(ev.target.result)); }
    catch { alert('Ungültige JSON-Datei.'); }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset so same file can be re-uploaded
});

// ─────────────────────────────────────────────
//  DELETE SELECTED
// ─────────────────────────────────────────────
function deleteSelected() {
  const s = state.selected;
  if (!s || !state.data) return;
  const wall = state.data.walls.find(w => w.id === s.wallId);
  if (!wall) return;
  pushHistory();

  if (s.kind === 'wall') {
    state.data.walls = state.data.walls.filter(w => w.id !== s.wallId);
  } else if (s.kind === 'window') {
    wall.windows.splice(s.idx, 1);
  } else if (s.kind === 'door') {
    wall.doors.splice(s.idx, 1);
  }

  state.selected = null;
  updateSidebar();
  render();
}

document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'z' && e.ctrlKey && e.shiftKey) { e.preventDefault(); redo(); return; }
  if (e.key === 'z' && e.ctrlKey)               { e.preventDefault(); undo(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
});

// ─────────────────────────────────────────────
//  ZOOM  (mouse-wheel, zoom toward cursor)
// ─────────────────────────────────────────────
const ZOOM_FACTOR = 1.12;
const ZOOM_MIN    = 0.2;
const ZOOM_MAX    = 8;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!state.data) return;
  const rect    = canvas.getBoundingClientRect();
  const mx      = e.clientX - rect.left;   // cursor in screen space
  const my      = e.clientY - rect.top;
  const factor  = e.deltaY < 0 ? ZOOM_FACTOR : 1 / ZOOM_FACTOR;
  const newScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, state.scale * factor));
  // Shift pan so the point under the cursor stays fixed
  state.pan.x = mx - (mx - state.pan.x) * (newScale / state.scale);
  state.pan.y = my - (my - state.pan.y) * (newScale / state.scale);
  state.scale = newScale;
  render();
}, { passive: false });

canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

// ─────────────────────────────────────────────
//  DEBUG PANEL
// ─────────────────────────────────────────────
function refreshDebugPanel() {
  const raw  = localStorage.getItem('floorplan');
  const body = document.getElementById('debug-body');
  if (!raw) { body.textContent = 'Nothing in localStorage (key: "floorplan").'; return; }

  try {
    const parsed = JSON.parse(raw);
    const walls  = parsed.walls;
    if (!walls) {
      body.textContent = 'Parsed OK but no "walls" key found.\n\nTop-level keys:\n'
        + Object.keys(parsed).join(', ')
        + '\n\nRaw (first 800 chars):\n'
        + raw.slice(0, 800);
      return;
    }
    const wins  = walls.reduce((a, w) => a + (w.windows||[]).length, 0);
    const doors = walls.reduce((a, w) => a + (w.doors||[]).length,   0);
    const sample = walls.slice(0, 3);
    body.textContent =
      `✓ walls: ${walls.length}  windows: ${wins}  doors: ${doors}\n\n`
      + `First ${sample.length} walls:\n`
      + JSON.stringify(sample, null, 2).slice(0, 1200);
  } catch(e) {
    body.textContent = 'JSON parse error: ' + e.message + '\n\nRaw (first 400 chars):\n' + raw.slice(0, 400);
  }
}

document.getElementById('btn-debug').addEventListener('click', () => {
  const panel = document.getElementById('debug-panel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible')) refreshDebugPanel();
});
document.getElementById('btn-debug-close').addEventListener('click', () => {
  document.getElementById('debug-panel').classList.remove('visible');
});
document.getElementById('btn-debug-copy').addEventListener('click', () => {
  const raw = localStorage.getItem('floorplan') || '';
  navigator.clipboard.writeText(raw).catch(() => {});
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
new ResizeObserver(() => {
  const r = viewport.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
  if (state.data) autoFit(); else render();
}).observe(viewport);

// Initial size
const vr = viewport.getBoundingClientRect();
canvas.width  = vr.width;
canvas.height = vr.height;

// Auto-load floorplan passed from analyze.html
const _saved  = localStorage.getItem('floorplan');
const _source = localStorage.getItem('floorplan_source');
const _overlay = document.getElementById('page-transition');
const _ptLabel = document.getElementById('pt-label');

function fadeOutOverlay() {
  // Small delay so the first render frame is painted before we reveal the editor
  requestAnimationFrame(() => requestAnimationFrame(() => {
    _overlay.classList.add('hidden');
    // Remove from flow after transition completes so it can't block clicks
    setTimeout(() => { _overlay.style.display = 'none'; }, 500);
  }));
}

if (_saved) {
  try {
    const parsed = JSON.parse(_saved);
    if (_source) document.getElementById('nav-source').textContent = _source;
    loadJSON(parsed);
    _ptLabel.textContent = 'Ready.';
  } catch(e) {
    _ptLabel.textContent = 'Load error — try uploading JSON manually.';
    render();
  }
} else {
  _ptLabel.textContent = 'No data — upload a JSON file.';
  render();
}

// Auto-load reference image stored by analyze.html
const _savedImg = localStorage.getItem('floorplan_image');
if (_savedImg) {
  const img = new Image();
  img.onload = () => {
    state.refImg     = img;
    state.showRefImg = true;
    document.getElementById('tb-refimg').classList.add('active');
    render();
  };
  img.src = _savedImg;
}

fadeOutOverlay();
</script>
