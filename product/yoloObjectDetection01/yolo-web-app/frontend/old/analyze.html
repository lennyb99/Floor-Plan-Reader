<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Ultimate Web UI</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 1200px; 
            margin: 40px auto; 
            text-align: center; 
            background-color: #f9f9f9; 
            color: #333; 
        }
        .upload-section { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 30px; 
        }
        .container { 
            display: flex; 
            justify-content: space-between; 
            gap: 15px; 
            margin-top: 20px; 
        }
        .box { 
            width: 32%; 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        img, canvas { 
            max-width: 100%; 
            max-height: 400px; 
            border-radius: 4px; 
            display: none; 
            margin: 10px auto; 
        }
        #json-text-field { 
            width: 100%; 
            height: 350px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            background-color: #1e1e1e; 
            color: #7ec699; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #333;
            resize: none;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            font-size: 16px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .btn:hover { background-color: #0056b3; }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #download-btn {
            background-color: #28a745;
            margin-top: 15px;
            display: none; 
        }
        #download-btn:hover { background-color: #218838; }
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .nav-item {
            margin: 0px 20px 0px 20px;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link" href="file:///C:/Users/Joshua/Documents/GitHub/Floor-Plan-Reader/product/yoloObjectDetection01/yolo-web-app/frontend/analyze.html">home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="file:///C:/Users/Joshua/Documents/GitHub/Floor-Plan-Reader/product/yoloObjectDetection01/yolo-web-app/frontend/revise.html">revise</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/share.html">share</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="upload-section">
        <input type="file" id="image-input" accept="image/*">
        <br><br>
        <button id="upload-btn" class="btn">Analyze & Render</button>
    </div>

    <div class="container">
        <div class="box">
            <h3>📥 1. Input Image</h3>
            <img id="original-view" alt="Original Preview">
        </div>
        
        <div class="box">
            <h3>🎨 2. Model Prediction Image</h3>
            <canvas id="prediction-canvas"></canvas>
        </div>
        
        <div class="box">
            <h3>📋 3. Output JSON Metadata</h3>
            <textarea id="json-text-field" readonly placeholder="// JSON metadata will appear here..."></textarea>
            <button id="download-btn" class="btn">💾 Download JSON File</button>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('image-input');
        const originalView = document.getElementById('original-view');
        const predictionCanvas = document.getElementById('prediction-canvas');
        const jsonTextField = document.getElementById('json-text-field');
        const uploadBtn = document.getElementById('upload-btn');
        const downloadBtn = document.getElementById('download-btn');

        let currentJsonData = null; 
        let loadedImage = null; 

        // Handle image selection preview
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                originalView.src = url;
                originalView.style.display = 'block';
                
                // FIXED: Create the virtual image image instance
                loadedImage = new Image();
                
                // FIXED: Force Javascript to wait until the image is 100% loaded into RAM before doing anything
                loadedImage.onload = () => {
                    // Set up canvas layout immediately
                    predictionCanvas.width = loadedImage.naturalWidth;
                    predictionCanvas.height = loadedImage.naturalHeight;
                    const ctx = predictionCanvas.getContext('2d');
                    ctx.drawImage(loadedImage, 0, 0);
                };
                
                // Set source *after* establishing the onload listener
                loadedImage.src = url;
                
                // Reset states
                predictionCanvas.style.display = 'none';
                jsonTextField.value = '';
                downloadBtn.style.display = 'none';
                currentJsonData = null;
            }
        });

        // Handle inference request
        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file || !loadedImage) {
                alert("Please select an image file first.");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            
            uploadBtn.innerText = "Processing...";
            uploadBtn.disabled = true;
            jsonTextField.value = "// Running model inference...";

            try {
                const response = await fetch('http://127.0.0.1:8000/detect', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Backend system inference error");

                const data = await response.json();
                currentJsonData = data; 

                // 1. Output the raw formatted JSON text
                jsonTextField.value = JSON.stringify(data, null, 4);
                downloadBtn.style.display = 'block';

                // 2. Draw the output image with the bounding boxes on the canvas
                drawPredictionsOntoCanvas(data.detections);

            } catch (error) {
                console.error(error);
                jsonTextField.value = `// Connection Error:\n// Verify server.py is actively running.`;
                downloadBtn.style.display = 'none';
            } finally {
                uploadBtn.innerText = "Analyze & Render";
                uploadBtn.disabled = false;
            }
        });

        // JavaScript Canvas Magic: Draws boxes natively based on JSON coordinates
        function drawPredictionsOntoCanvas(detections) {
            const ctx = predictionCanvas.getContext('2d');
            
            // Explicitly set sizes to match natural dimensions
            predictionCanvas.width = loadedImage.naturalWidth;
            predictionCanvas.height = loadedImage.naturalHeight;
            
            // Draw the background original image safely
            ctx.drawImage(loadedImage, 0, 0);
            
            // Loop through each detection inside the JSON object array
            detections.forEach(det => {
                const { xmin, ymin, xmax, ymax } = det.bbox;
                const width = xmax - xmin;
                const height = ymax - ymin;
                
                // 1. Draw the box outline
                ctx.strokeStyle = '#00FF00'; 
                ctx.lineWidth = Math.max(2, predictionCanvas.width * 0.004); 
                ctx.strokeRect(xmin, ymin, width, height);
                
                // 2. Draw label background pill
                ctx.fillStyle = '#00FF00';
                const fontSize = Math.max(12, predictionCanvas.width * 0.02);
                ctx.font = `bold ${fontSize}px Arial`;
                const labelText = `${det.name} (${Math.round(det.confidence * 100)}%)`;
                const textWidth = ctx.measureText(labelText).width;
                
                ctx.fillRect(xmin, ymin - fontSize - 4, textWidth + 10, fontSize + 6);
                
                // 3. Render label text over pill
                ctx.fillStyle = '#000000'; 
                ctx.fillText(labelText, xmin + 5, ymin - 5);
            });
            
            predictionCanvas.style.display = 'block';
        }

        // Trigger JSON download
        downloadBtn.addEventListener('click', () => {
            if (!currentJsonData) return;
            const blob = new Blob([JSON.stringify(currentJsonData, null, 4)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `yolo_metadata_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
