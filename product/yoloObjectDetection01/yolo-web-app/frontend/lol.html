<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Floorplan Editor with Elements</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 300px; padding: 20px; background: #f4f4f4; border-right: 1px solid #ccc; }
        #canvas-container { flex-grow: 1; background: #eee; }
        .wall { stroke: #333; stroke-width: 2px; }
        .window { fill: #87CEEB; stroke: #000; stroke-width: 1px; }
        .door { fill: #DEB887; stroke: #8B4513; stroke-width: 1px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Floorplan Editor</h3>
    <input type="file" id="fileInput" accept=".json">
</div>

<div id="canvas-container">
    <svg id="canvas" width="100%" height="100%" viewBox="0 0 500 400">
        <g id="viewport"></g>
    </svg>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = JSON.parse(event.target.result);
            render(data);
        };
        reader.readAsText(e.target.files[0]);
    });

    function render(data) {
        const viewport = document.getElementById('viewport');
        viewport.innerHTML = '';

        data.walls.forEach(wall => {
            // Draw Wall
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", wall.start.x);
            line.setAttribute("y1", wall.start.y);
            line.setAttribute("x2", wall.end.x);
            line.setAttribute("y2", wall.end.y);
            line.setAttribute("class", "wall");
            viewport.appendChild(line);

            // Draw Doors
            wall.doors.forEach(doors => {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", door.original_bbox.xmin);
                rect.setAttribute("y", door.original_bbox.ymin);
                rect.setAttribute("width", door.original_bbox.xmax - door.original_bbox.xmin);
                rect.setAttribute("height", door.original_bbox.ymax - door.original_bbox.ymin);
                rect.setAttribute("class", "door");
                viewport.appendChild(rect);
            });

            // Draw Windows
            wall.windows.forEach(win => {
                // Assuming similar bbox structure as doors
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", win.original_bbox.xmin);
                rect.setAttribute("y", win.original_bbox.ymin);
                rect.setAttribute("width", win.original_bbox.xmax - win.original_bbox.xmin);
                rect.setAttribute("height", win.original_bbox.ymax - win.original_bbox.ymin);
                rect.setAttribute("class", "window");
                viewport.appendChild(rect);
            });
        });
    }
</script>
</body>
</html>
